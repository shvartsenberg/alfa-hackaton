name: CI

on:
  push:
    branches: [main, performance-QA]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Type check (mypy)
        run: mypy app

      - name: Run tests
        run: pytest

      - name: Run concurrency tests
        run: pytest -m concurrency

      - name: Validate submission packaging
        run: |
          python scripts/package_submission.py /tmp/submission.zip
          python scripts/package_submission.py --validate /tmp/submission.zip
