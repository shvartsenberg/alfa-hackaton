enabled: true

detection:
  enabled_types:
    - EMAIL
    - PHONE
    - PERSON_NAME
    - PASSPORT_NUMBER
    - BANK_CARD

masking:
  EMAIL: PARTIAL_MASK
  PHONE: PARTIAL_MASK
  PERSON_NAME: PARTIAL_MASK
  PASSPORT_NUMBER: PARTIAL_MASK
  BANK_CARD: PARTIAL_MASK
  INN: PARTIAL_MASK
  DRIVER_LICENSE: PARTIAL_MASK
  CARDHOLDER_NAME: PARTIAL_MASK
  PASSPORT_DIVISION_CODE: PARTIAL_MASK

demasking:
  enabled: true

context_rules:
  - type: PIN
    requires:
      - BANK_CARD
    enabled: true