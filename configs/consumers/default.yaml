enabled: true

detection:
  enabled_types:
    - PERSON_NAME
    - BIRTH_DATE
    - BIRTH_PLACE
    - PASSPORT_NUMBER
    - CITIZENSHIP
    - PASSPORT_ISSUER
    - PASSPORT_DIVISION_CODE
    - PASSPORT_ISSUE_DATE
    - DRIVER_LICENSE
    - ADDRESS
    - COUNTRY
    - POSTAL_CODE
    - CITY
    - STREET
    - HOUSE
    - APARTMENT
    - EMAIL
    - PHONE
    - INN
    - BANK_CARD
    - CVV
    - PIN
    - CARDHOLDER_NAME

masking:
  EMAIL: PARTIAL_MASK
  PHONE: PARTIAL_MASK
  PERSON_NAME: PARTIAL_MASK
  PASSPORT_NUMBER: PARTIAL_MASK
  BANK_CARD: PARTIAL_MASK
  INN: PARTIAL_MASK
  DRIVER_LICENSE: PARTIAL_MASK
  CARDHOLDER_NAME: PARTIAL_MASK
  PASSPORT_DIVISION_CODE: PARTIAL_MASK

demasking:
  enabled: true

context_rules:
  - type: PIN
    requires:
      - BANK_CARD
    enabled: true