enabled: true

detection:
  enabled_types:
    - EMAIL
    - PHONE
    - INN
    - BANK_CARD
    - CVV
    - PIN

masking:
  EMAIL: PARTIAL_MASK
  PHONE: FULL_MASK
  INN: PARTIAL_MASK
  BANK_CARD: PARTIAL_MASK
  CVV: FULL_MASK
  PIN: FULL_MASK

demasking:
  enabled: true

context_rules:
  - type: PIN
    requires:
      - BANK_CARD
    enabled: true