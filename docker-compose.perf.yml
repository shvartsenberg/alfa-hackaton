# Performance overlay for the PII proxy.
#
# Used together with the base docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.perf.yml up --build -d
#
# This overlay only overrides the `api` service for a load run:
#   - 4 uvicorn workers (Redis-backed store is required for multiworker state).
#   - No access log and WARNING log level to reduce per-request logging overhead
#     during a load test.
# It does NOT touch the `redis` service or any other container. The base
# docker-compose.yml is left unchanged.
services:
  api:
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "4"
      - --log-level
      - warning
      - --no-access-log
    environment:
      - LOG_LEVEL=WARNING
      - LOG_FORMAT=json